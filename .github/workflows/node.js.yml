# CI: установка и запуск smoke-тестов в среде Windows
name: Node.js CI (Windows)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Меняем Linux на Windows
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [build]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # На Windows команда отработает аналогично
      - name: Install dependencies
        run: npm install

      - name: Build (if present)
        run: npm run build --if-present

      - name: Test
        run: npm test
