# ... (строки name: и on: остаются прежними)

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x, 22.x] # Проверьте, чтобы тут было написано именно node-version через дефис

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }} # Здесь имя должно строго совпадать с матрицей выше

      - name: Install dependencies
        run: npm install

      - name: Build (if present)
        run: npm run build --if-present

      - name: Test
        run: npm test
